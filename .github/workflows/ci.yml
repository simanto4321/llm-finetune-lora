name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest scikit-learn numpy
      - name: Run pure-Python / baseline tests
        run: pytest tests/test_data_and_manifest.py -v
      - name: Fast baseline comparison
        run: python baseline.py --fast

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify metrics file
        run: test -f metrics.json
      - name: Run inference with bundled LoRA adapter
        run: python inference.py --text "Great product, works perfectly!"
      - name: Pytest inference smoke
        run: pytest tests/test_inference_smoke.py -v -m heavy
      - name: Pytest unit + skippable heavy (train smoke optional)
        run: pytest tests/ -v --ignore=tests/test_train_smoke.py
      - name: Train smoke (max_steps=1)
        run: pytest tests/test_train_smoke.py -v -m heavy
        # DistilBERT download + one step; keep visible in CI logs
        timeout-minutes: 30
