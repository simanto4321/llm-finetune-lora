name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run inference with bundled LoRA adapter
        run: python inference.py --text "Great product, works perfectly!"
      - name: Verify metrics file
        run: test -f metrics.json
